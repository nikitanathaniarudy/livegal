<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Gal Game ✦</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">Live Gal Game <span>— prototype</span></div>
    <div class="model-pill">
      <div class="status-dot" id="status-dot"></div>
      <span>model:</span>
      <input type="text" id="model-input" value="llama3.2" spellcheck="false" title="Ollama model name"/>
    </div>
  </header>

  <main class="scene">

    <!-- Top row: camera panel + dialogue side by side -->
    <div class="scene-top">

      <!-- Left: camera feed + affection meter -->
      <div class="camera-panel">
        <div class="scene-label">— person —</div>

        <div class="camera-preview" id="camera-preview">
          <video id="camera-feed" autoplay playsinline muted></video>

          <!-- Overlay shown before camera starts / while loading models -->
          <div class="camera-overlay" id="camera-overlay">
            <button class="camera-start-btn" id="camera-start-btn">Enable camera</button>
            <div class="camera-overlay-hint" id="camera-overlay-hint"></div>
          </div>

          <!-- Score popup anchored to camera area -->
          <div class="score-popup" id="score-popup"></div>
        </div>

        <!-- Affection meter -->
        <div class="affection-meter">
          <span class="affection-label">affection</span>
          <div class="affection-bar-wrap">
            <div class="affection-bar-fill" id="affection-bar-fill"></div>
            <div class="affection-center-line"></div>
          </div>
          <span class="affection-total" id="affection-total">0</span>
        </div>
      </div>

      <!-- Right: dialogue box -->
      <div class="dialogue-panel">
        <div class="scene-label">— they said —</div>
        <div class="dialogue-box">
          <div class="dialogue-speaker">Person</div>
          <div class="dialogue-text empty" id="dialogue-display">
            Type what they said below and press Generate ↓
          </div>
        </div>
      </div>

    </div>

    <!-- Input row -->
    <div class="input-row">
      <button class="mic-btn" id="mic-btn" title="Click to speak">🎙</button>
      <input
        class="speech-input"
        id="speech-input"
        type="text"
        placeholder="Type or press 🎙 to speak…"
        autocomplete="off"
      />
      <button class="generate-btn" id="generate-btn">Generate →</button>
    </div>
    <div class="transcript-hint" id="transcript-hint"></div>

    <div id="error-container"></div>

    <div class="choices-label">— your response —</div>
    <div class="choices-grid" id="choices-grid">
      <div class="empty-choices">Options will appear here after you generate</div>
    </div>

  </main>

  <section class="history-section">
    <div class="history-label">
      <span>— conversation history —</span>
      <button class="clear-btn" id="clear-btn">clear</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </section>

  <!-- face-api.js loaded as a global before ES modules -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
